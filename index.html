<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>luyu</title>

  <!-- Big Cartel Minimalist Styling -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Store Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 26px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Centered Single Product Layout */
    .product-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* Product Image */
    .product-image {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 24px;
      object-fit: cover;
      display: block;
    }

    /* Product Details */
    .product-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .product-price {
      font-size: 18px;
      color: #666666;
      margin-bottom: 24px;
    }

    /* Big Cartel Style Black Add to Cart Button */
    .snipcart-add-item {
      width: 100%;
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 18px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 2px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .snipcart-add-item:hover {
      background-color: #333333;
    }

    /* Email Sign-Up Form Styling */
    .email-form {
      margin-top: 40px;
      text-align: center;
      border-top: 1px solid #eeeeee;
      padding-top: 30px;
    }
    .email-headline {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input[type="email"] {
      flex: 1;
      padding: 14px;
      border: 1px solid #cccccc;
      border-radius: 2px;
      font-size: 14px;
      outline: none;
    }
    .input-group button {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      border-radius: 2px;
      cursor: pointer;
    }

    /* Footer */
    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #999999;
      letter-spacing: 1px;
    }
  </style>

  <!-- Snipcart CSS & JavaScript Dependencies -->
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.0.31/default/snipcart.js"></script>
  <script>
    window.SnipcartSettings = {
      publicApiKey: 'MzY1NzExMDMtMTE3ZC00ZDUwLWFjZjEtNGM5NDgyMjhjMGFkNjM5MjQ5NTg2MzAwNzM3NTA0',
      loadStrategy: 'on-user-interaction',
    };
  </script>
</head>
<body>

  <!-- Brand Title Header -->
  <header>
    <h1>luyu</h1>
  </header>

  <!-- Product Container -->
  <main class="product-card">
    <img src="shirt.jpg" alt="Custom Graphic Tee" class="product-image" />
    
    <h2 class="product-title">Custom Graphic T-Shirt</h2>
    <p class="product-price">$35.00</p>

    <!-- Buy Button -->
    <button
      class="snipcart-add-item"
      data-item-id="tshirt-001"
      data-item-name="Custom Graphic T-Shirt"
      data-item-price="35.00"
      data-item-url="/"
      data-item-image="shirt.jpg"
      data-item-custom1-name="Size"
      data-item-custom1-options="Small|Medium|Large|X-Large|2XL">
      Add to Cart
    </button>

    <!-- Email Sign-Up Form (Netlify Forms) -->
    <form name="newsletter" method="POST" data-netlify="true" class="email-form">
      <p class="email-headline">JOIN THE LIST</p>
      <div class="input-group">
        <input type="email" name="email" placeholder="Enter your email" required />
        <button type="submit">SUBMIT</button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 LUYU</p>
  </footer>

  <!-- Snipcart Cart Container -->
  <div id="snipcart" data-api-key="MzY1NzExMDMtMTE3ZC00ZDUwLWFjZjEtNGM5NDgyMjhjMGFkNjM5MjQ5NTg2MzAwNzM3NTA0" hidden></div>

</body>
</html>
